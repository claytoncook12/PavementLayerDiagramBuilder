<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Pavement layers cross-section icon -->

  <!-- Border/frame -->
  <rect x="2" y="4" width="28" height="24" rx="2" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Asphalt layer (top) - dark with diagonal lines -->
  <rect x="4" y="6" width="24" height="6" fill="#2d2d2d"/>
  <line x1="4" y1="12" x2="10" y2="6" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="10" y1="12" x2="16" y2="6" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="16" y1="12" x2="22" y2="6" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="22" y1="12" x2="28" y2="6" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Aggregate layer (middle) - tan with dots -->
  <rect x="4" y="12" width="24" height="7" fill="#d4a76a"/>
  <circle cx="8" cy="15" r="1.5" fill="#b8905a"/>
  <circle cx="14" cy="16" r="1" fill="#b8905a"/>
  <circle cx="20" cy="14" r="1.5" fill="#b8905a"/>
  <circle cx="25" cy="17" r="1" fill="#b8905a"/>
  <circle cx="11" cy="18" r="1" fill="#b8905a"/>
  <circle cx="17" cy="13" r="1" fill="#b8905a"/>
  <circle cx="23" cy="18" r="1.5" fill="#b8905a"/>

  <!-- Subgrade layer (bottom) - light tan with reverse diagonals -->
  <rect x="4" y="19" width="24" height="7" fill="#e8d4a8"/>
  <line x1="4" y1="19" x2="10" y2="26" stroke="#d4c090" stroke-width="1"/>
  <line x1="10" y1="19" x2="16" y2="26" stroke="#d4c090" stroke-width="1"/>
  <line x1="16" y1="19" x2="22" y2="26" stroke="#d4c090" stroke-width="1"/>
  <line x1="22" y1="19" x2="28" y2="26" stroke="#d4c090" stroke-width="1"/>
</svg>
