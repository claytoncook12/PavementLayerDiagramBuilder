<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pavement Layer Diagram Builder</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <img src="favicon.svg" alt="" class="header-icon">
            <h1>Pavement Layer Diagram Builder</h1>
        </header>

        <main class="main-content">
            <!-- Left Panel: Layer Editor -->
            <section class="editor-panel">
                <div class="panel-header">
                    <h2>Layer Configuration</h2>
                    <button id="addLayerBtn" class="btn btn-primary">+ Add Layer</button>
                </div>

                <div id="layersList" class="layers-list">
                    <!-- Layers will be added here dynamically -->
                </div>

                <div class="editor-actions">
                    <button id="clearAllBtn" class="btn btn-danger">Clear All</button>
                    <button id="loadExampleBtn" class="btn btn-secondary">Load Example</button>
                </div>

                <div class="saved-diagrams-section">
                    <div class="saved-diagrams-header">
                        <h3>Saved Diagrams</h3>
                        <button id="saveDiagramBtn" class="btn btn-primary btn-sm">Save New</button>
                    </div>
                    <div id="savedDiagramsList" class="saved-diagrams-list">
                        <p class="no-saved">No saved diagrams</p>
                    </div>
                </div>
            </section>

            <!-- Right Panel: Diagram Preview -->
            <section class="preview-panel">
                <div class="panel-header">
                    <h2>Pavement Section Diagram</h2>
                    <div class="header-controls">
                        <div class="scale-controls">
                            <label for="scaleInput">Scale: 1" = </label>
                            <input type="number" id="scaleInput" value="20" min="5" max="100" step="5">
                            <span>px</span>
                        </div>
                        <div class="scale-controls">
                            <label for="widthInput">Width:</label>
                            <input type="number" id="widthInput" value="300" min="200" max="800" step="50">
                            <span>px</span>
                        </div>
                        <button id="exportPngBtn" class="btn btn-primary">Export PNG</button>
                    </div>
                </div>

                <div class="diagram-title-input">
                    <label for="diagramTitle">Diagram Title:</label>
                    <input type="text" id="diagramTitle" placeholder="e.g., Highway 101 - Section A">
                </div>

                <div class="total-thickness">
                    Total Thickness: <span id="totalThickness">0</span> inches
                </div>

                <div class="diagram-container">
                    <div id="pavementDiagram" class="pavement-diagram">
                        <div class="diagram-placeholder">
                            Add layers to see the diagram
                        </div>
                    </div>

                    <!-- Legend (generated dynamically from config) -->
                    <div class="diagram-legend">
                        <h3>Legend</h3>
                        <div id="legendItems" class="legend-items">
                            <!-- Legend items will be generated dynamically -->
                        </div>
                    </div>
                </div>

                
            </section>
        </main>
    </div>

    <!-- Layer Edit Modal -->
    <div id="layerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add Layer</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="layerForm">
                <div class="form-group">
                    <label for="layerType">Layer Type</label>
                    <select id="layerType" required>
                        <!-- Options generated dynamically from config -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="materialName">Material Description</label>
                    <input type="text" id="materialName" placeholder="e.g., PG 64-22 Surface Mix" required>
                </div>

                <div class="form-group">
                    <label for="thickness">Thickness (inches)</label>
                    <input type="number" id="thickness" step="0.5" min="0.5" max="100" placeholder="e.g., 3.5" required>
                </div>

                <div class="form-group form-check" id="infiniteGroup" style="display: none;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="infiniteLayer">
                        <span>Infinite depth (extends indefinitely)</span>
                    </label>
                </div>

                <hr class="form-divider">
                <h4 class="form-section-title">Geosynthetics</h4>

                <div class="form-group">
                    <label for="geosyntheticPosition">Geosynthetic Position</label>
                    <select id="geosyntheticPosition">
                        <option value="bottom">Bottom of Layer</option>
                        <option value="top">Top of Layer</option>
                    </select>
                </div>

                <div class="geosynthetic-row">
                    <div class="geosynthetic-item">
                        <div class="form-group form-check">
                            <label class="checkbox-label">
                                <input type="checkbox" id="geosyntheticEnabled">
                                <span>Geosynthetic 1</span>
                            </label>
                        </div>

                        <div id="geosyntheticOptions" style="display: none;">
                            <div class="form-group">
                                <label for="geosyntheticName">Name</label>
                                <input type="text" id="geosyntheticName" placeholder="e.g., Tensar TX5">
                            </div>

                            <div class="form-group">
                                <label for="geosyntheticColor">Color</label>
                                <select id="geosyntheticColor">
                                    <option value="black">Black</option>
                                    <option value="red">Red</option>
                                    <option value="green">Green</option>
                                    <option value="yellow">Yellow</option>
                                    <option value="blue">Blue</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="geosynthetic-item">
                        <div class="form-group form-check">
                            <label class="checkbox-label">
                                <input type="checkbox" id="geosynthetic2Enabled">
                                <span>Geosynthetic 2</span>
                            </label>
                        </div>

                        <div id="geosynthetic2Options" style="display: none;">
                            <div class="form-group">
                                <label for="geosynthetic2Name">Name</label>
                                <input type="text" id="geosynthetic2Name" placeholder="e.g., Tensar TX5">
                            </div>

                            <div class="form-group">
                                <label for="geosynthetic2Color">Color</label>
                                <select id="geosynthetic2Color">
                                    <option value="black">Black</option>
                                    <option value="red">Red</option>
                                    <option value="green">Green</option>
                                    <option value="yellow">Yellow</option>
                                    <option value="blue">Blue</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveLayerBtn">Save Layer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Save Diagram Modal -->
    <div id="saveModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>Save Diagram</h3>
                <button class="modal-close" id="closeSaveModal">&times;</button>
            </div>
            <form id="saveForm">
                <div class="form-group">
                    <label for="diagramName">Diagram Name</label>
                    <input type="text" id="diagramName" placeholder="e.g., Highway 101 Section A" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelSaveBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="config/layer-types.js"></script>
    <script src="config/geosynthetic-types.js"></script>
    <script src="js/pattern-generator.js"></script>
    <script src="app.js"></script>
</body>
</html>
